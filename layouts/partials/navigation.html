<nav class="main-nav">

	<div class="nav-inner">

	<div class="site-title">
		<img src="{{ .Site.Params.Author.avatar }}" width="40" height="40" class="site-image">		
		<a href="/">{{ .Site.Title }}</a>
	</div>

	<button class="nav-toggle" id="nav-toggle" aria-label="Menú" aria-expanded="false" aria-controls="site-menus">☰</button>

	<div class="site-menus" id="site-menus">

		{{ range .Site.Menus.main }}
			{{ if and .Page .Page.Params.redirect_url }}
				<a href="{{ .Page.Params.redirect_url }}">{{ .Name }}</a>
			{{ else }}
				<a href="{{ .URL | relLangURL | safeURL }}">{{ .Name }}</a>
			{{ end }}
		{{ end }}

	</div>

	</div>
</nav>
<script>
(function () {
	var btn = document.getElementById("nav-toggle");
	var menu = document.getElementById("site-menus");
	if (!btn || !menu) return;
	btn.addEventListener("click", function () {
		var open = menu.classList.toggle("open");
		btn.setAttribute("aria-expanded", open ? "true" : "false");
		btn.textContent = open ? "✕" : "☰";
	});
})();
</script>
